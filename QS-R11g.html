<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Quantum Sands - Revised</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1e3a5f;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:100vh; overflow:hidden;
  font-family:'Segoe UI', Arial, sans-serif;
}
canvas {
  display:block;
  width:100vw; height:100vh;
  object-fit:contain;
  image-rendering:pixelated;
}
#hud {
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  color:#fff; font-size:13px; background:rgba(0,0,0,0.55);
  padding:6px 18px; border-radius:20px; white-space:nowrap;
  user-select:none; pointer-events:none;
}
#seed-input-box {
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.7); border-radius:12px;
  padding:10px 18px; display:flex; gap:10px; align-items:center;
}
#seed-input-box input {
  background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.4);
  color:#fff; font-family:monospace; font-size:14px; font-weight:bold;
  padding:4px 10px; border-radius:8px; width:110px; text-transform:uppercase;
  letter-spacing:2px; text-align:center;
}
#seed-input-box button {
  background:#3b82f6; color:#fff; border:none; border-radius:8px;
  font-size:12px; padding:5px 12px; cursor:pointer;
}
#legend {
  position:absolute; bottom:20px; left:160px;
  background:rgba(10,25,50,0.82);
  border-radius:10px; padding:10px 14px;
  border:1px solid rgba(255,255,255,0.10);
  user-select:none; pointer-events:none;
}
#legend .leg-item {
  display:flex; align-items:center; gap:8px;
  margin:3px 0; font-size:12px; color:#e8eef5;
}
#legend .leg-swatch {
  width:14px; height:14px; border-radius:2px; flex-shrink:0;
  border:1px solid rgba(255,255,255,0.25);
}
#transition-modal {
  display: none;
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(10, 25, 50, 0.95);
  border: 2px solid rgba(255, 255, 255, 0.2);
  padding: 25px 40px; border-radius: 12px;
  text-align: center; color: #fff; z-index: 100;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}
#transition-modal p { margin-bottom: 20px; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
.modal-btn-container { display: flex; gap: 15px; justify-content: center; }
.modal-btn {
  background: #3b82f6; color: #fff; border: none; border-radius: 8px;
  font-size: 14px; padding: 8px 20px; cursor: pointer; font-weight: bold;
  transition: background 0.2s;
}
.modal-btn:hover { background: #2563eb; }
.modal-btn.cancel { background: #64748b; }
.modal-btn.cancel:hover { background: #475569; }

#death-screen {
  display: none;
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, rgba(40,5,25,0.55) 0%, rgba(4,8,20,0.92) 70%, rgba(2,4,12,0.98) 100%);
  z-index: 200; align-items: center; justify-content: center;
  flex-direction: column; opacity: 0; transition: opacity 0.9s ease;
  user-select: none;
}
#death-screen.show { display: flex; opacity: 1; }
#death-screen .death-title {
  color: #f3d9e4; font-size: 26px; font-weight: bold; letter-spacing: 3px;
  text-shadow: 0 2px 18px rgba(150,20,70,0.8); margin-bottom: 6px;
}
#death-screen .death-sub {
  color: #9fb0c8; font-size: 13px; letter-spacing: 2px; margin-bottom: 26px;
}
#death-screen .death-emoji { font-size: 60px; margin-bottom: 14px; filter: drop-shadow(0 0 22px rgba(120,30,70,0.9)); }
#death-screen #btn-restart {
  background: #7a2d4d; color: #fff; border: 1px solid rgba(255,180,210,0.35);
  border-radius: 10px; font-size: 15px; padding: 10px 28px; cursor: pointer;
  font-weight: bold; letter-spacing: 2px; transition: background 0.2s, transform 0.1s;
}
#death-screen #btn-restart:hover { background: #9c3a63; }
#death-screen #btn-restart:active { transform: scale(0.96); }
</style>
</head>
<body>
<div id="hud">🎮 WASD / 方向鍵 / 單擊地圖 移動　｜　🪨 靠近石頭後 雙擊石頭 或按 空白鍵 拾取　｜　✋ 持石時 單擊 移動 / 雙擊格子 投擲</div>
<canvas id="gameCanvas"></canvas>

<div id="legend">
  <div class="leg-item"><div class="leg-swatch" style="background:#0b2f52"></div>深層海</div>
  <div class="leg-item"><div class="leg-swatch" style="background:#38bdf8"></div>淺層海</div>
  <div class="leg-item"><div class="leg-swatch" style="background:#f5dfa0"></div>沙灘</div>
  <div class="leg-item"><div class="leg-swatch" style="background:#5cd67a"></div>草地</div>
  <div class="leg-item"><div class="leg-swatch" style="background:#c8cdd4"></div>石地</div>
</div>

<div id="seed-input-box">
  <label style="color:#fff; font-size:12px;">輸入種子碼:</label>
  <input id="seed-input" maxlength="5" placeholder="XXXXX" />
  <button onclick="applySeed()">套用</button>
  <button onclick="randomSeed()">隨機</button>
</div>

<div id="transition-modal">
  <p>是否穿越至下張地圖？</p>
  <div class="modal-btn-container">
    <button id="btn-yes" class="modal-btn">是</button>
    <button id="btn-no" class="modal-btn cancel">暫時不要</button>
  </div>
</div>

<div id="death-screen">
  <div class="death-emoji">🐙</div>
  <p class="death-title">你被海怪拖入深海……</p>
  <p class="death-sub">THE DEEP TOOK YOU</p>
  <button id="btn-restart">重新開始</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width  = 1280;
canvas.height = 720;

const playerSprite = new Image();
playerSprite.src = 'savage.png';
const SPRITE_COLUMNS = 4, SPRITE_ROWS = 4;
let SPRITE_FRAME_W = 0, SPRITE_FRAME_H = 0;
playerSprite.onload = () => {
  SPRITE_FRAME_W = playerSprite.naturalWidth  / SPRITE_COLUMNS;
  SPRITE_FRAME_H = playerSprite.naturalHeight / SPRITE_ROWS;
};

const ROWS = 18, COLS = 20;
const TW = 56, TH = 28, HW = TW/2, HH = TH/2;
const ELEV = { '-1':10, '0':10, '1':10, '2':20, '3':30 };
const BASE_BOTTOM = 1;

function getThick(type) { return BASE_BOTTOM + (ELEV[String(type)] ?? 0); }

const COLOR = {
  '-1': { top:'#0b2f52', left:'#061c33', right:'#092540' },
   '0': { top:'#38bdf8', left:'#0369a1', right:'#0284c7' },
   '1': { top:'#f5dfa0', left:'#b5935a', right:'#d4aa6a' },
   '2': { top:'#5cd67a', left:'#1a7a35', right:'#22a048' },
   '3': { top:'#c8cdd4', left:'#5a6070', right:'#8a909a' },
};

let MAP = [];
let currentSeed = '';

const footprints = [];
let footprintBudget = 0;
let stepFoot = 0;
const FOOTPRINT_FADE_MS = 1500;
const FOOTPRINT_COUNT   = 7;

function footOffset(dir, foot) {
  const side = foot === 0 ? -1 : 1;
  switch (dir) {
    case 0: return { ox: side * 4,  oy:  side * 2  };
    case 1: return { ox: side * 4,  oy: -side * 2  };
    case 2: return { ox: -side * 4, oy: -side * 2  };
    case 3: return { ox: -side * 4, oy:  side * 2  };
    default: return { ox: 0, oy: 0 };
  }
}

function addFootprint(gx, gy, foot, dir) {
  const type = tileAt(gx, gy);
  if (type < 1) return;
  footprints.push({
    gx, gy, foot, dir, type,
    alpha: 0.70,
    born: performance.now(),
    maxLifetime: FOOTPRINT_FADE_MS * (0.85 + Math.random() * 0.30)
  });
}

function updateFootprints(now) {
  for (let i = footprints.length - 1; i >= 0; i--) {
    const fp = footprints[i];
    const elapsed = now - fp.born;
    const fadeStart = fp.maxLifetime * 0.30;
    if (elapsed >= fp.maxLifetime) {
      footprints.splice(i, 1);
    } else if (elapsed > fadeStart) {
      fp.alpha = 0.70 * (1 - (elapsed - fadeStart) / (fp.maxLifetime - fadeStart));
    }
  }
}

function drawFootprint(fp) {
  const type = tileAt(fp.gx, fp.gy);
  if (type < 1) return;
  const p = toScreen(fp.gx, fp.gy, type);
  const { ox, oy } = footOffset(fp.dir, fp.foot);

  let r = 80, g = 120, b = 160;
  if (type === 1) { r = 155; g = 130; b = 90;  }
  if (type === 2) { r = 55;  g = 95;  b = 75;  }
  if (type === 3) { r = 95;  g = 105; b = 125; }

  ctx.save();
  ctx.globalAlpha = fp.alpha;
  ctx.translate(p.x + ox, p.y + oy - 4);
  const isoAngle = Math.atan2(HH, HW);
  const rotDir = (fp.dir === 0 || fp.dir === 1) ? 1 : -1;
  ctx.rotate(rotDir * isoAngle * 0.5);

  ctx.beginPath();
  ctx.ellipse(0, 0, 6, 3.2, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fill();
  ctx.restore();
}

function drawFootprints(gx, gy) {
  for (const fp of footprints) {
    if (fp.gx === gx && fp.gy === gy) drawFootprint(fp);
  }
}

const ripples = [];
const RIPPLE_DURATION = 3000;

function addRipple(gx, gy) {
  const p = toScreen(gx, gy, 0);
  ripples.push({
    x: p.x,
    y: p.y,
    born: performance.now(),
    duration: RIPPLE_DURATION * (0.8 + Math.random() * 0.4)
  });
}

function updateRipples(now) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    if (now - ripples[i].born >= ripples[i].duration) ripples.splice(i, 1);
  }
}

function drawRipplesAt(gx, gy, p) {
  const now = performance.now();
  if (ripples.length === 0) return;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(p.x, p.y - HH);
  ctx.lineTo(p.x + HW, p.y);
  ctx.lineTo(p.x, p.y + HH);
  ctx.lineTo(p.x - HW, p.y);
  ctx.closePath();
  ctx.clip();

  for (const rp of ripples) {
    const distSq = (rp.x - p.x)**2 + (rp.y - p.y)**2;
    if (distSq > 5000) continue; 

    const t = (now - rp.born) / rp.duration;  
    if (t < 0 || t >= 1) continue;

    const maxRx = HW * 2.2;
    const maxRy = HH * 2.2;
    const rx = maxRx * t;
    const ry = maxRy * t;
    const alpha = 0.55 * (1 - t) * (1 - t);

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgba(180, 230, 255, 1)';
    ctx.lineWidth = 1.2 * (1 - t * 0.5);
    ctx.beginPath();
    ctx.ellipse(rp.x, rp.y, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();

    if (t > 0.15) {
      const t2 = (t - 0.15) / 0.85;
      const rx2 = maxRx * t2 * 0.6;
      const ry2 = maxRy * t2 * 0.6;
      ctx.globalAlpha = alpha * 0.6;
      ctx.lineWidth = 0.8 * (1 - t2 * 0.5);
      ctx.beginPath();
      ctx.ellipse(rp.x, rp.y, rx2, ry2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

const splashDrops = [];

function addSplash(gx, gy) {
  const p = toScreen(gx, gy, -1);
  const count = 1 + Math.floor(Math.random() * 8);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 3.5;
    const vx = Math.cos(angle) * speed * 0.7;
    const vy = Math.sin(angle) * speed * 0.35 - (2.5 + Math.random() * 3.5);
    splashDrops.push({
      gx, gy,
      x: p.x + (Math.random() - 0.5) * 12,
      y: p.y + (Math.random() - 0.5) * 6,
      vx, vy,
      gravity: 0.18 + Math.random() * 0.10,
      r: 1.2 + Math.random() * 2.0,
      alpha: 0.85 + Math.random() * 0.15,
      born: performance.now(),
      life: 500 + Math.random() * 400,
      isLanding: false
    });
  }
  splashDrops.push({
    gx, gy,
    x: p.x, y: p.y,
    vx: 0, vy: 0,
    gravity: 0,
    r: 0,
    alpha: 0.7,
    born: performance.now(),
    life: 350,
    isCrown: true,
    maxR: 14
  });
}

function updateSplashDrops(now) {
  for (let i = splashDrops.length - 1; i >= 0; i--) {
    const d = splashDrops[i];
    const elapsed = now - d.born;
    if (elapsed >= d.life) { splashDrops.splice(i, 1); continue; }
    if (!d.isCrown) {
      d.x += d.vx;
      d.y += d.vy;
      d.vy += d.gravity;
      d.alpha = 0.85 * (1 - elapsed / d.life);
    } else {
      d.r = d.maxR * (elapsed / d.life);
      d.alpha = 0.7 * (1 - elapsed / d.life);
    }
  }
}

function drawSplashDropsAt(gx, gy) {
  for (const d of splashDrops) {
    if (d.gx !== gx || d.gy !== gy) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, d.alpha);
    if (d.isCrown) {
      ctx.strokeStyle = 'rgba(140, 210, 255, 1)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.r, d.r * 0.45, 0, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(160, 220, 255, 1)';
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.r, d.r * 0.65, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

const bodyDroplets = [];
let bodyDripActive = false;
let bodyDripUntil = 0;
let bodyDripIntensity = 0; 

function startBodyDrip(intensity) {
  bodyDripActive = true;
  bodyDripUntil = performance.now() + (100 + Math.random() * 5);
  bodyDripIntensity = intensity;
}

function updateBodyDroplets(now) {
  if (bodyDripActive && now < bodyDripUntil) {
    const remaining = (bodyDripUntil - now) / 1800;
    const spawnRate = Math.ceil(bodyDripIntensity * remaining * 3);
    if (player.frame % Math.max(1, 4 - spawnRate) === 0) {
      const rGx = Math.round(player.gx), rGy = Math.round(player.gy);
      const type = tileAt(rGx, rGy);
      const p = toScreen(player.gx, player.gy, type);
      const dw = 10;
      const spot = { ox: (Math.random() - 0.5) * dw * 0.4, oy: -12 + Math.random() * 6  };
      bodyDroplets.push({
        x: p.x + spot.ox,
        y: p.y + spot.oy,
        vy: 0.3 + Math.random() * 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        r: 1.0 + Math.random() * 1.5,
        alpha: 0.7 + Math.random() * 0.3,
        born: now,
        life: 400 + Math.random() * 150,
        streakLen: 1 + Math.random() * 1
      });
    }
  } else if (now >= bodyDripUntil) {
    bodyDripActive = false;
  }

  for (let i = bodyDroplets.length - 1; i >= 0; i--) {
    const d = bodyDroplets[i];
    const elapsed = now - d.born;
    if (elapsed >= d.life) { bodyDroplets.splice(i, 1); continue; }
    d.x += d.vx;
    d.y += d.vy;
    d.vy += 0.08;
    d.alpha = 0.7 * (1 - elapsed / d.life);
  }
}

function drawBodyDroplets() {
  for (const d of bodyDroplets) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, d.alpha);
    const speed = d.vy;
    const stretchY = Math.min(d.streakLen, speed * 2.5);
    ctx.fillStyle = 'rgba(180, 230, 255, 0.9)';
    ctx.strokeStyle = 'rgba(120, 190, 240, 0.6)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r * 0.6, d.r + stretchY * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
}

const surfaceBubbles = [];
function updateSurfaceBubbles() {
  const now = performance.now();
  for (let i = surfaceBubbles.length - 1; i >= 0; i--) {
    const b = surfaceBubbles[i];
    const elapsed = now - b.born;
    if (elapsed > b.life) {
      surfaceBubbles.splice(i, 1);
    } else {
      b.oy -= 0.15; 
      b.alpha = 1 - (elapsed / b.life);
    }
  }
}

function drawSurfaceBubblesAt(gx, gy, p) {
  for (const b of surfaceBubbles) {
    if (b.gx === gx && b.gy === gy) {
      ctx.save();
      ctx.globalAlpha = b.alpha * 0.6;
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.arc(p.x + b.ox, p.y + b.oy, b.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════════════════════
// 🐟 淺海魚群系統 (修正：僅在非交界區活動)
// ═══════════════════════════════════════════════════════
const fishes = [];
const FISH_FLEE_DIST_SQ = 3.5 * 3.5; 
const FISH_NORMAL_SPEED = 0.006;      
const FISH_FLEE_SPEED   = 0.085;      
const FISH_DIVE_INTERVAL_MIN = 4000;  
const FISH_DIVE_INTERVAL_MAX = 9000;
const FISH_DIVE_DURATION_MIN = 2000;
const FISH_DIVE_DURATION_MAX = 5000;
const FISH_MAX_COUNT = 12;

// 鵝卵石落水後的短暫驚嚇座標
let pebbleScarePosGx = -999;
let pebbleScarePosGy = -999;
let pebbleScareUntil = 0;

// 判斷是否為淺海交界
function isShallowBorder(gx, gy) {
  if (tileAt(gx, gy) !== 0) return false;
  const neighbors = [
    tileAt(gx + 1, gy), tileAt(gx - 1, gy),
    tileAt(gx, gy + 1), tileAt(gx, gy - 1)
  ];
  return neighbors.some(t => t !== 0);
}

function spawnFishesOnMap() {
  fishes.length = 0;
  const shallowTiles = [];
  for (let gy = 0; gy < ROWS; gy++)
    for (let gx = 0; gx < COLS; gx++)
      // 修正：必須是淺海且非交界
      if (MAP[gy][gx] === 0 && !isShallowBorder(gx, gy)) shallowTiles.push({gx, gy});
  
  const count = Math.min(FISH_MAX_COUNT, Math.floor(shallowTiles.length * 0.05));
  for (let i = 0; i < count; i++) {
    const tile = shallowTiles[Math.floor(Math.random() * shallowTiles.length)];
    const angle = Math.random() * Math.PI * 2;
    const now = performance.now();
    fishes.push({
      gx: tile.gx + (Math.random() - 0.5) * 0.7,
      gy: tile.gy + (Math.random() - 0.5) * 0.7,
      angle: angle, targetAngle: angle,
      speed: FISH_NORMAL_SPEED, fleeing: false, vanishing: false,
      diving: false, diveAlpha: 0,
      nextDiveAt: now + FISH_DIVE_INTERVAL_MIN + Math.random() * (FISH_DIVE_INTERVAL_MAX - FISH_DIVE_INTERVAL_MIN),
      diveEndAt: 0,
      bodyLen: 12 + Math.random() * 4, bodyW: 4 + Math.random() * 1.5,
      hue: 200 + Math.random() * 5, turnAt: now + 1000 + Math.random() * 2000,
    });
  }
}

function updateFishes(now) {
  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i];

    if (f.vanishing) {
      f.diveAlpha -= 0.1;
      if (f.diveAlpha <= 0) {
        fishes.splice(i, 1);
        // 補生至合格區域
        const shallowTiles = [];
        for (let gy = 0; gy < ROWS; gy++)
          for (let gx = 0; gx < COLS; gx++)
            if (MAP[gy][gx] === 0 && !isShallowBorder(gx, gy)) shallowTiles.push({gx, gy});
        if (shallowTiles.length > 0) {
          const tile = shallowTiles[Math.floor(Math.random() * shallowTiles.length)];
          const angle = Math.random() * Math.PI * 2;
          fishes.push({
            gx: tile.gx + (Math.random() - 0.5) * 0.7, gy: tile.gy + (Math.random() - 0.5) * 0.7,
            angle, targetAngle: angle, speed: FISH_NORMAL_SPEED, fleeing: false, vanishing: false,
            diving: false, diveAlpha: 0,
            nextDiveAt: now + FISH_DIVE_INTERVAL_MIN + Math.random() * (FISH_DIVE_INTERVAL_MAX - FISH_DIVE_INTERVAL_MIN),
            diveEndAt: 0,
            bodyLen: 12 + Math.random() * 4, bodyW: 4 + Math.random() * 1.5,
            hue: 200 + Math.random() * 5, turnAt: now + 1000 + Math.random() * 2000,
          });
        }
      }
      continue;
    }

    const dx = f.gx - player.gx, dy = f.gy - player.gy;
    const distSq = dx * dx + dy * dy;

    // 同時計算與鵝卵石落水點的距離
    const now2 = performance.now();
    let scareDistSq = Infinity;
    if (now2 < pebbleScareUntil) {
      const sdx = f.gx - pebbleScarePosGx, sdy = f.gy - pebbleScarePosGy;
      scareDistSq = sdx * sdx + sdy * sdy;
    }

    if (distSq < FISH_FLEE_DIST_SQ || scareDistSq < FISH_FLEE_DIST_SQ) {
      // 逃離距離更近的威脅
      let fleeFromGx = player.gx, fleeFromGy = player.gy;
      if (scareDistSq < distSq && scareDistSq < FISH_FLEE_DIST_SQ) {
        fleeFromGx = pebbleScarePosGx; fleeFromGy = pebbleScarePosGy;
      }
      f.fleeing = true;
      f.targetAngle = Math.atan2(f.gy - fleeFromGy, f.gx - fleeFromGx);
      f.speed = FISH_FLEE_SPEED;
    } else {
      f.fleeing = false; f.speed = FISH_NORMAL_SPEED;
      if (now > f.turnAt) {
        f.targetAngle = f.angle + (Math.random() - 0.5) * Math.PI * 1.2;
        f.turnAt = now + 1500 + Math.random() * 3000;
      }
    }

    let da = f.targetAngle - f.angle;
    while (da >  Math.PI) da -= Math.PI * 2;
    while (da < -Math.PI) da += Math.PI * 2;
    f.angle += da * (f.fleeing ? 0.25 : 0.04);

    const nx = f.gx + Math.cos(f.angle) * f.speed;
    const ny = f.gy + Math.sin(f.angle) * f.speed;
    const tx = Math.round(nx), ty = Math.round(ny);
    const tileCheck = tileAt(tx, ty);
    const isBorder = isShallowBorder(tx, ty);

    // 修正：若前進方向非淺海或屬交界區
    if (tileCheck === 0 && !isBorder) {
      f.gx = nx; f.gy = ny;
    } else {
      if (f.fleeing) {
        f.vanishing = true; // 逃跑時碰到交界直接消失
      } else {
        f.targetAngle = f.angle + Math.PI + (Math.random() - 0.5) * 0.8;
        f.turnAt = now + 200;
      }
    }


    // 潛水邏輯
    if (!f.diving && now > f.nextDiveAt && !f.fleeing) {
      f.diving = true;
      f.diveEndAt = now + FISH_DIVE_DURATION_MIN + Math.random() * (FISH_DIVE_DURATION_MAX - FISH_DIVE_DURATION_MIN);
    }

    if (f.diving) {
      if (f.fleeing) {
        // 被人追趕，強制結束潛水狀態
        f.diving = false; 
        // 移除 f.diveAlpha = 1.0; 讓它自然浮現
        f.nextDiveAt = now + FISH_DIVE_INTERVAL_MIN + Math.random() * (FISH_DIVE_INTERVAL_MAX - FISH_DIVE_INTERVAL_MIN);
      } else if (now > f.diveEndAt) {
        // 自然潛水時間到，結束潛水
        f.diving = false; 
        // 移除 f.diveAlpha = 1.0; 讓它自然浮現
        f.nextDiveAt = now + FISH_DIVE_INTERVAL_MIN + Math.random() * (FISH_DIVE_INTERVAL_MAX - FISH_DIVE_INTERVAL_MIN);
      } else {
        // 正在下潛：逐漸變淡
        f.diveAlpha = Math.max(0.18, f.diveAlpha - 0.008);
      }
    } else {
      // 正在浮起：逐漸變深（包含逃跑消失後重新生成的魚也會走這段）
      f.diveAlpha = Math.min(1.0, f.diveAlpha + 0.005);
    }
  }
}

function drawAllFishes() {
  const sorted = fishes.slice().sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));
  for (const f of sorted) {
    if (tileAt(Math.round(f.gx), Math.round(f.gy)) !== 0) continue;
    const p = toScreen(f.gx, f.gy, 0);
    const cosA = Math.cos(f.angle), sinA = Math.sin(f.angle);
    const sdx = (cosA - sinA) * HW, sdy = (cosA + sinA) * HH;
    const len = Math.sqrt(sdx * sdx + sdy * sdy) || 1;
    const ux = sdx/len, uy = sdy/len, px = -uy, py = ux;
    const BL = f.bodyLen, BW = f.bodyW;

    ctx.save();
    ctx.globalAlpha = f.diveAlpha * 0.88;
    ctx.fillStyle = `hsla(${f.hue}, 70%, 40%, ${f.diveAlpha})`;
    ctx.strokeStyle = `hsla(${f.hue}, 55%, 50%, ${f.diveAlpha * 0.8})`;
    ctx.lineWidth = 0.6;

    const hx = p.x + ux * BL * 0.5, hy = p.y + uy * BL * 0.5;
    const tx = p.x - ux * BL * 0.5, ty = p.y - uy * BL * 0.5;

    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.bezierCurveTo(hx + px * BW, hy + py * BW, tx + px * BW * 0.6, ty + py * BW * 0.6, tx, ty);
    ctx.bezierCurveTo(tx - px * BW * 0.6, ty - py * BW * 0.6, hx - px * BW, hy - py * BW, hx, hy);
    ctx.fill(); ctx.stroke();

    const fx1 = tx + px * BW * 0.5 - ux * BL * 0.35, fy1 = ty + py * BW * 0.5 - uy * BL * 0.35;
    const fx2 = tx - px * BW * 1.4 - ux * BL * 0.35, fy2 = ty - py * BW * 1.4 - uy * BL * 0.35;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(fx1, fy1); ctx.lineTo(fx2, fy2); ctx.closePath();
    ctx.fillStyle = `hsla(${f.hue + 10}, 60%, 60%, ${f.diveAlpha * 0.85})`;
    ctx.fill();
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════
// 🪨 鵝卵石物件系統
// ═══════════════════════════════════════════════════════
// 持有鵝卵石的精靈圖（之後再換成實際畫好的圖）
const pebbleHeldSprite = new Image();
pebbleHeldSprite.src = 'cssavage.png'; // 持有狀態
const pebbleThrowSprite = new Image();
pebbleThrowSprite.src = 'rcssavage.png'; // 投擲動作狀態

// 地圖上的鵝卵石物件列表：{ gx, gy, shade, sRx, sRy, angle }
let pebbleObjects = [];
// 玩家是否正在持有鵝卵石
let playerHoldingPebble = false;

// 建立鵝卵石物件（每張新地圖重新生成）
function buildPebbleObjects() {
  pebbleObjects = [];
  const mapSeedNum = seedFromString(currentSeed);
  for (let gy = 0; gy < ROWS; gy++) {
    for (let gx = 0; gx < COLS; gx++) {
      if (MAP[gy][gx] !== 3) continue; // 只在石地上生成
      // 用地圖座標+種子做雜湊，確保每次同種子結果相同
      let h = (gx * 374761393 + gy * 668265263 + mapSeedNum) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177); h = h ^ (h >>> 16);
      // 5% 機率生成
      if ((Math.abs(h) % 100) >= 5) continue;
      const hk2 = Math.abs(Math.imul(h ^ (h >>> 9), 374761393));
      const hk3 = Math.abs(Math.imul(hk2 ^ (hk2 >>> 11), 2246822519));
      // 隨機視覺偏移（不影響格子邏輯位置）
      const ox = ((hk2 % 201) - 100) / 100 * 7;  // ±7 像素
      const oy = ((hk3 % 201) - 100) / 100 * 4;  // ±4 像素
      pebbleObjects.push({
        gx, gy,
        ox, oy,
        sRx: 4,
        sRy: 3,
        angle: 0,
        shade: 171 + (Math.abs(h) % 5)
      });
    }
  }
}

// 取得玩家附近（切比雪夫距離 1，含斜鄰）的鵝卵石
// 若玩家已持有鵝卵石則一律回傳 null（只能持有一顆）
function getNearbyPebble() {
  if (playerHoldingPebble) return null;
  for (const pb of pebbleObjects) {
    const dx = Math.abs(pb.gx - player.tx);
    const dy = Math.abs(pb.gy - player.ty);
    if (dx <= 1 && dy <= 1) return pb;
  }
  return null;
}

// 拾取鵝卵石
function pickUpPebble(pb) {
  const idx = pebbleObjects.indexOf(pb);
  if (idx !== -1) {
    pebbleObjects.splice(idx, 1);
    playerHoldingPebble = true;
    heldPebbleShade = pb.shade; // 記住石頭顏色
  }
}

// ═══════════════════════════════════════════════════════
// 🪨 投擲系統
// ═══════════════════════════════════════════════════════
let throwAnim = null; // 當前投擲動畫狀態

// 投擲動畫持有的靜態鵝卵石資訊（投擲前的shade）
let heldPebbleShade = 170;

// 水花特效（鵝卵石落水）
const pebbleSplashes = [];

function addPebbleSplash(gx, gy) {
  const type = tileAt(gx, gy);
  const p = toScreen(gx, gy, type);
  const count = 8 + Math.floor(Math.random() * 6);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 3.0;
    pebbleSplashes.push({
      x: p.x + (Math.random() - 0.5) * 10,
      y: p.y + (Math.random() - 0.5) * 5,
      vx: Math.cos(angle) * speed * 0.7,
      vy: Math.sin(angle) * speed * 0.35 - (2.0 + Math.random() * 3.0),
      gravity: 0.16 + Math.random() * 0.12,
      r: 1.0 + Math.random() * 2.2,
      alpha: 0.9,
      born: performance.now(),
      life: 450 + Math.random() * 350,
    });
  }
  // 水面冠狀
  pebbleSplashes.push({
    x: p.x, y: p.y,
    vx: 0, vy: 0, gravity: 0,
    r: 0, alpha: 0.75,
    born: performance.now(),
    life: 400,
    isCrown: true, maxR: 18,
  });
}

function updatePebbleSplashes(now) {
  for (let i = pebbleSplashes.length - 1; i >= 0; i--) {
    const d = pebbleSplashes[i];
    const elapsed = now - d.born;
    if (elapsed >= d.life) { pebbleSplashes.splice(i, 1); continue; }
    if (!d.isCrown) {
      d.x += d.vx; d.y += d.vy; d.vy += d.gravity;
      d.alpha = 0.9 * (1 - elapsed / d.life);
    } else {
      d.r = d.maxR * (elapsed / d.life);
      d.alpha = 0.75 * (1 - elapsed / d.life);
    }
  }
}

function drawPebbleSplashes() {
  for (const d of pebbleSplashes) {
    if (d.alpha <= 0) continue;
    ctx.save();
    ctx.globalAlpha = Math.max(0, d.alpha);
    if (d.isCrown) {
      if (d.r < 0.5) { ctx.restore(); continue; } // 半徑太小跳過，避免 ellipse(0,0) 崩潰
      ctx.strokeStyle = 'rgba(120, 200, 255, 1)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.r, Math.max(0.5, d.r * 0.45), 0, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      if (d.r < 0.5) { ctx.restore(); continue; }
      ctx.fillStyle = 'rgba(150, 215, 255, 1)';
      ctx.beginPath();
      ctx.ellipse(d.x, d.y, d.r, Math.max(0.5, d.r * 0.6), 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// 觸發投擲：目標為 (tgx, tgy)
function throwPebble(tgx, tgy) {
  if (!playerHoldingPebble || throwAnim) return;
  // 投擲方向：讓玩家面向目標
  const dx = tgx - player.gx, dy = tgy - player.gy;
  if (Math.abs(dx) >= Math.abs(dy)) {
    player.dir = dx > 0 ? 1 : 3;
  } else {
    player.dir = dy > 0 ? 2 : 0;
  }

  const startType = tileAt(Math.round(player.gx), Math.round(player.gy));
  const startP = toScreen(player.gx, player.gy, startType);
  const targetType = tileAt(tgx, tgy);
  const targetP = toScreen(tgx, tgy, targetType);

  const THROW_DURATION = 520; // ms
  const now = performance.now();

  // 鵝卵石落地後是否沉入水中
  const targetTile = tileAt(tgx, tgy);
  const sinksInWater = (targetTile === 0 || targetTile === -1);

  // 落地視覺偏移（水中不需要，陸地上隨機偏一點）
  const landOx = sinksInWater ? 0 : (Math.random() - 0.5) * 14;
  const landOy = sinksInWater ? 0 : (Math.random() - 0.5) * 8;

  throwAnim = {
    startX: startP.x,
    startY: startP.y - 20, // 從角色手部高度拋出
    endX: targetP.x + landOx,
    endY: targetP.y - 4 + landOy,
    tgx, tgy,
    landOx, landOy,
    born: now,
    duration: THROW_DURATION,
    done: false,
    sinksInWater,
    shade: heldPebbleShade,
    phase: 'throwing', // 'throwing' | 'landed'
  };

  playerHoldingPebble = false;
}

function updateThrowAnim(now) {
  if (!throwAnim) return;
  if (throwAnim.done) { throwAnim = null; return; }

  const elapsed = now - throwAnim.born;
  const t = Math.min(elapsed / throwAnim.duration, 1);

// 尋找並修改 updateThrowAnim 函式中的落地邏輯區塊
if (t >= 1) {
  throwAnim.done = true;
  const tgx = throwAnim.tgx, tgy = throwAnim.tgy;
  const type = tileAt(tgx, tgy);

  if (type < 1) {
    // 原有的水花處理
    addPebbleSplash(tgx, tgy);
    pebbleScarePosGx = tgx; 
    pebbleScarePosGy = tgy;
    pebbleScareUntil = now + 1200;
    // 🐙 朝深海格投擲 → 累積海怪觸發條件
    if (type === -1) registerDeepSeaThrow(tgx, tgy);
  } else {
    // 落地在陸地上時的原本邏輯
    const landOx = throwAnim.landOx ?? 0;
    const landOy = throwAnim.landOy ?? 0;

    // ── 打飛判斷：目標格已有石頭時，90% 機率打飛它 ──
    const existing = pebbleObjects.find(p => p.gx === tgx && p.gy === tgy);
    if (existing && Math.random() < 0.9) {
      launchKnockedPebble(existing, tgx, tgy);
    }

    pebbleObjects.push({
      gx: tgx, gy: tgy,
      ox: landOx, oy: landOy,
      shade: throwAnim.shade,
      sRx: 4, sRy: 3, angle: 0
    });

    // 如果落地的格子是草地 (type 2)，觸發搖晃效果
    if (type === 2) {
      trampleGrass(tgx, tgy); 
    }
  }
  
  playerHoldingPebble = false;
  throwAnim = null;
}
}

function drawThrowAnim(now) {
  if (!throwAnim || throwAnim.done) return;
  const elapsed = now - throwAnim.born;
  const t = Math.min(elapsed / throwAnim.duration, 1);

  // 拋物線插值
  const lx = throwAnim.startX + (throwAnim.endX - throwAnim.startX) * t;
  const ly = throwAnim.startY + (throwAnim.endY - throwAnim.startY) * t;
  // 拋物線高度：sin(pi*t) 形成弧形，最高點在中途
  const arcHeight = 55 + Math.abs(throwAnim.endX - throwAnim.startX) * 0.18;
  const arcY = ly - Math.sin(Math.PI * t) * arcHeight;

  // 縮放：飛行中略小，落地前恢復
  const scale = 0.9 + 0.1 * (1 - Math.sin(Math.PI * t) * 0.5);

  const g = throwAnim.shade;
  const r = 3 * scale;
  // 陰影
  ctx.save();
  ctx.globalAlpha = 0.25 * (1 - t * 0.3);
  ctx.beginPath();
  ctx.ellipse(lx + 2, arcY + 4, r * 0.9, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  ctx.restore();
  // 鵝卵石本體
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(lx, arcY, r, r * 0.67, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgb(${g}, ${g - 4}, ${g - 5})`;
  ctx.fill();
  ctx.strokeStyle = '#000000'; // 邊框顏色
  ctx.lineWidth = 0.2;           // 邊框粗細
  ctx.stroke();                // 執行繪製邊框
  // 高光
  ctx.beginPath();
  ctx.ellipse(lx - r * 0.25, arcY - r * 0.3, r * 0.38, r * 0.28, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fill();
  ctx.restore();
}

// ═══════════════════════════════════════════════════════
// 🪨 被打飛的石頭動畫（二次飛行）
// ═══════════════════════════════════════════════════════
const secondaryThrows = [];

function launchKnockedPebble(pb, fromGx, fromGy) {
  // 從 pebbleObjects 移除被打飛的石頭
  const idx = pebbleObjects.indexOf(pb);
  if (idx !== -1) pebbleObjects.splice(idx, 1);

  // 隨機飛往 1~3 格外的鄰近格子（8方向加權）
  const dist = 1 + Math.floor(Math.random() * 3); // 1~3 格
  const angle = Math.random() * Math.PI * 2;
  const stepX = Math.round(Math.cos(angle) * dist);
  const stepY = Math.round(Math.sin(angle) * dist);
  let tgx = fromGx + stepX;
  let tgy = fromGy + stepY;
  // 夾在地圖範圍內
  tgx = Math.max(0, Math.min(COLS - 1, tgx));
  tgy = Math.max(0, Math.min(ROWS - 1, tgy));

  const startType = tileAt(fromGx, fromGy);
  const startP = toScreen(fromGx, fromGy, startType);
  const targetType = tileAt(tgx, tgy);
  const targetP = toScreen(tgx, tgy, targetType);

  const sinksInWater = (targetType === 0 || targetType === -1);
  const landOx = sinksInWater ? 0 : (Math.random() - 0.5) * 14;
  const landOy = sinksInWater ? 0 : (Math.random() - 0.5) * 8;

  // 飛行時間比主投擲短，弧線也矮一些
  const duration = 280 + Math.random() * 120;

  secondaryThrows.push({
    startX: startP.x + (pb.ox ?? 0),
    startY: startP.y + (pb.oy ?? 0) - 4,
    endX: targetP.x + landOx,
    endY: targetP.y - 4 + landOy,
    tgx, tgy, landOx, landOy,
    born: performance.now(),
    duration,
    done: false,
    sinksInWater,
    shade: pb.shade,
  });
}

function updateSecondaryThrows(now) {
  for (let i = secondaryThrows.length - 1; i >= 0; i--) {
    const sa = secondaryThrows[i];
    if (sa.done) { secondaryThrows.splice(i, 1); continue; }
    const elapsed = now - sa.born;
    const t = Math.min(elapsed / sa.duration, 1);
    if (t >= 1) {
      sa.done = true;
      const type = tileAt(sa.tgx, sa.tgy);
      if (type < 1) {
        // 落水：水花 + 嚇魚
        addPebbleSplash(sa.tgx, sa.tgy);
        pebbleScarePosGx = sa.tgx;
        pebbleScarePosGy = sa.tgy;
        pebbleScareUntil = now + 1200;
      } else {
        // 落陸：放回 pebbleObjects，並繼續連鎖打飛檢查
        const newPb = {
          gx: sa.tgx, gy: sa.tgy,
          ox: sa.landOx, oy: sa.landOy,
          shade: sa.shade,
          sRx: 4, sRy: 3, angle: 0
        };
        // 連鎖：若該格已有石頭，有 50% 機率再打飛（能量衰減，機率降低）
        const existing = pebbleObjects.find(p => p.gx === sa.tgx && p.gy === sa.tgy);
        if (existing && Math.random() < 0.5) {
          launchKnockedPebble(existing, sa.tgx, sa.tgy);
        }
        pebbleObjects.push(newPb);
        if (type === 2) trampleGrass(sa.tgx, sa.tgy);
      }
    }
  }
}

function drawSecondaryThrows(now) {
  for (const sa of secondaryThrows) {
    if (sa.done) continue;
    const elapsed = now - sa.born;
    const t = Math.min(elapsed / sa.duration, 1);
    const lx = sa.startX + (sa.endX - sa.startX) * t;
    const ly = sa.startY + (sa.endY - sa.startY) * t;
    // 弧線比主投擲矮（距離短，弧高也小）
    const arcHeight = 20 + Math.abs(sa.endX - sa.startX) * 0.15;
    const arcY = ly - Math.sin(Math.PI * t) * arcHeight;
    const scale = 0.85 + 0.1 * (1 - Math.sin(Math.PI * t) * 0.5);
    const g = sa.shade;
    const r = 3 * scale;
    // 陰影
    ctx.save();
    ctx.globalAlpha = 0.20 * (1 - t * 0.3);
    ctx.beginPath();
    ctx.ellipse(lx + 2, arcY + 4, r * 0.9, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fill();
    ctx.restore();
    // 石頭本體
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(lx, arcY, r, r * 0.67, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${g}, ${g - 4}, ${g - 5})`;
    ctx.fill();
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 0.2;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(lx - r * 0.25, arcY - r * 0.3, r * 0.38, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.fill();
    ctx.restore();
  }
}

// 繪製地圖上的鵝卵石物件
function drawPebbleObject(pb) {
  const p = toScreen(pb.gx, pb.gy, tileAt(pb.gx, pb.gy));
  const nearby = getNearbyPebble();
  const isNear = nearby === pb;

  // 套用視覺偏移（ox/oy 為像素偏移，預設 0）
  const ox = pb.ox ?? 0;
  const oy = pb.oy ?? 0;
  const px = p.x + ox;
  const py = p.y + oy;

  // 白光光暈（玩家靠近時泛起）— 跟石頭位置一致
  if (isNear) {
    const now = performance.now();
    const pulse = 0.3 + 0.2 * Math.sin(now * 0.006); // 緩慢脈動
    ctx.save();
    const grad = ctx.createRadialGradient(px, py - 2, 2, px, py - 2, 13);
    grad.addColorStop(0, `rgba(255,255,255,${pulse})`);
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(px, py - 2, 20, 12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 鵝卵石本體
  ctx.save();
  ctx.translate(px, py - 4);
  // 陰影（固定在右下方，不隨角度旋轉）
  ctx.beginPath();
  ctx.ellipse(-1.5, 2.5, pb.sRx, pb.sRy * 0.55, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.fill();
  // 主體（使用固定角度，不旋轉，避免上下顛倒）
  ctx.beginPath();
  ctx.ellipse(0, 0, pb.sRx, pb.sRy, 0, 0, Math.PI * 2);
  const g = pb.shade;
  ctx.fillStyle = `rgb(${g}, ${g - 4}, ${g - 5})`;
  ctx.fill();
  ctx.strokeStyle = '#000000'; // 邊框顏色
  ctx.lineWidth = 0.2;           // 邊框粗細
  ctx.stroke();                // 執行繪製邊框
  // 高光（固定在左上方，模擬光源在左上）
  ctx.beginPath();
  ctx.ellipse(-pb.sRx * 0.25, -pb.sRy * 0.3, pb.sRx * 0.38, pb.sRy * 0.28, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,255,255,0.28)`;
  ctx.fill();
  ctx.restore();
}

// 繪製玩家持有鵝卵石時的精靈（覆蓋在玩家上方）
// 實際繪製由 drawPlayer 內部判斷，這裡只是定義旗標
// （精靈圖設定：pebbleHeldSprite，格式同 playerSprite，4×4 欄列）

// ════════════════════════════════════════════════════════════
// 🐙 海怪系統 (Sea Monster / Kraken Tentacle)
//   觸發：地圖深海格 > 5，且玩家朝深海格投擲石頭累積達 3 次，
//         海怪從「最後投擲的那格深海」伸出甩動的章魚觸手。
//   危險：玩家進入觸手 5 格範圍內 → 被捲走拖入深海 → 死亡重來。
// ════════════════════════════════════════════════════════════
let deepSeaCount   = 0;      // 當前地圖深海格數量
let deepThrowCount = 0;      // 朝深海格投擲累積次數
let seaMonster     = null;   // 海怪狀態物件（null = 無）
let isDead         = false;  // 死亡鎖

const SM_GRAB_RANGE   = 5;      // 捲走偵測範圍（格）
const SM_EMERGE_MS    = 950;    // 浮現（警告）時間
const SM_LURK_MS      = 11000;  // 潛伏甩動時間，超時收回
const SM_RETRACT_MS   = 800;    // 收回時間
const SM_GRAB_MS      = 1150;   // 捲走拖拽動畫時間
const tentacleSplashes = [];

// 計算地圖深海格數量
function countDeepSea() {
  let c = 0;
  for (let r = 0; r < ROWS; r++)
    for (let col = 0; col < COLS; col++)
      if (MAP[r][col] === -1) c++;
  return c;
}

// 朝深海格投擲落地時呼叫
function registerDeepSeaThrow(gx, gy) {
  if (isDead || seaMonster) return;
  if (deepSeaCount <= 5) return;          // 深海格不足 → 不觸發
  deepThrowCount++;
  if (deepThrowCount >= 3) spawnSeaMonster(gx, gy);
}

function spawnSeaMonster(gx, gy) {
  seaMonster = {
    gx, gy,
    born: performance.now(),
    phase: 'emerging',                    // emerging → lurking → grab / retracting
    swayPhase: Math.random() * Math.PI * 2,
    curlDir: 1,                           // 固定朝右捲曲（左朝右）
    grabStart: 0,
    grabFromGx: 0, grabFromGy: 0,
    decor: pickDecorTentacles(gx, gy),    // 附近裝飾短觸手（不抓人）
  };
  deepThrowCount = 0;
  spawnEmergeSplash(gx, gy, 18);
  for (const d of seaMonster.decor) spawnEmergeSplash(d.gx, d.gy, 8);
}

function spawnEmergeSplash(gx, gy, n) {
  for (let k = 0; k < n; k++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3;
    tentacleSplashes.push({
      gx, gy, x: 0, y: 0,
      vx: Math.cos(a) * sp * 0.8, vy: Math.sin(a) * sp * 0.4 - (2 + Math.random() * 3),
      r: 1.2 + Math.random() * 2.2, alpha: 0.9, born: performance.now(),
      life: 500 + Math.random() * 400, grav: 0.16 + Math.random() * 0.08
    });
  }
}

// 在主深海格附近找最多 4 個深海格作為裝飾短觸手的根部
function pickDecorTentacles(gx, gy) {
  const cands = [];
  const R = 3;
  for (let dy = -R; dy <= R; dy++)
    for (let dx = -R; dx <= R; dx++) {
      if (dx === 0 && dy === 0) continue;
      const nx = gx + dx, ny = gy + dy;
      if (tileAt(nx, ny) === -1) cands.push({ gx: nx, gy: ny, dist: Math.hypot(dx, dy) });
    }
  cands.sort((a, b) => (a.dist - b.dist) || (Math.random() - 0.5));
  return cands.slice(0, 4).map(c => ({
    gx: c.gx, gy: c.gy,
    swayPhase: Math.random() * Math.PI * 2,
    curlDir: 1,                         // 固定朝右捲曲（左朝右）
    lenPx: 46 + Math.random() * 30,     // 短
    baseW: 7 + Math.random() * 3
  }));
}

function gridDist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }

function updateSeaMonster(now) {
  // 觸手水花
  for (let i = tentacleSplashes.length - 1; i >= 0; i--) {
    const d = tentacleSplashes[i];
    const e = now - d.born;
    if (e >= d.life) { tentacleSplashes.splice(i, 1); continue; }
    d.x += d.vx; d.y += d.vy; d.vy += d.grav;
    d.alpha = 0.9 * (1 - e / d.life);
  }
  if (!seaMonster || isDead) return;
  const m = seaMonster;
  const age = now - m.born;

  if (m.phase === 'emerging') {
    if (age >= SM_EMERGE_MS) { m.phase = 'lurking'; m.born = now; }
    return;
  }

  if (m.phase === 'lurking') {
    // 偵測玩家是否進入範圍
    const pgx = player.gx, pgy = player.gy;
    if (gridDist(pgx, pgy, m.gx, m.gy) <= SM_GRAB_RANGE) {
      m.phase = 'grab';
      m.grabStart = now;
      m.grabFromGx = player.gx; m.grabFromGy = player.gy;
      held.clear();
      return;
    }
    if (age >= SM_LURK_MS) { m.phase = 'retracting'; m.born = now; }
    return;
  }

  if (m.phase === 'grab') {
    const gt = Math.min((now - m.grabStart) / SM_GRAB_MS, 1);
    if (gt >= 0.32) {
      // 拖拽：玩家被拉向深海格
      const dt = smoothstep((gt - 0.32) / 0.68);
      player.gx = lerp(m.grabFromGx, m.gx, dt);
      player.gy = lerp(m.grabFromGy, m.gy, dt);
      player.tx = player.gx; player.ty = player.gy;
      if (gt > 0.5 && player.frame % 4 === 0) {
        const sp = toScreen(player.gx, player.gy, -1);
        for (let k = 0; k < 3; k++) {
          const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 2.5;
          tentacleSplashes.push({
            gx: Math.round(player.gx), gy: Math.round(player.gy),
            x: 0, y: 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.4 - (1.5 + Math.random() * 2),
            r: 1 + Math.random() * 1.8, alpha: 0.85, born: now, life: 380 + Math.random() * 280,
            grav: 0.15
          });
        }
      }
    }
    if (gt >= 1) triggerDeath();
    return;
  }

  if (m.phase === 'retracting') {
    if (age >= SM_RETRACT_MS) seaMonster = null;
    return;
  }
}

// 建立一條觸手中心線（含捷曲螺旋）
function buildTentacle(base, opts) {
  const SEG = 22;
  const emerge = opts.emerge;
  const fullLen = opts.lenPx * emerge;
  const segLen = fullLen / SEG;
  const t = opts.now * 0.0035 + opts.swayPhase;
  const cd = opts.curlDir;

  let angle = -Math.PI / 2;                              // 根部固定朝正上方（不隨擺動傾斜）
  let x = base.x, y = base.y - 2;
  const pts = [{ x, y, w: opts.baseW * emerge, angle }];

  for (let i = 1; i <= SEG; i++) {
    const f = i / SEG;
    const wave = Math.sin(t * 1.4 + f * 5.0) * (0.015 + f * 0.05);
    const sway = Math.sin(t) * 0.10 * f;       // 整體擺動：根部(f=0)為0，向尖端漸增
    const curl = 0.03 + f * f * 0.58;          // 越靠尖端捷得越緊 → 螺旋
    angle += cd * (curl + wave + sway);
    x += Math.cos(angle) * segLen;
    y += Math.sin(angle) * segLen;
    const w = (opts.baseW * Math.pow(1 - f, 0.6) + opts.tipW) * emerge;
    pts.push({ x, y, w, angle });
  }

  // 撲擊／拖拽：朝目標伸直撲出
  if (opts.tipTarget && opts.lungeBlend > 0) {
    for (let i = 0; i <= SEG; i++) {
      const f = i / SEG;
      const sx = base.x + (opts.tipTarget.x - base.x) * f;
      const sy = base.y + (opts.tipTarget.y - base.y) * f;
      const k = opts.lungeBlend * f;
      pts[i].x = lerp(pts[i].x, sx, k);
      pts[i].y = lerp(pts[i].y, sy, k);
    }
  }
  return pts;
}

function drawSucker(x, y, r) {
  ctx.beginPath();                                   // 外圍陰影
  ctx.ellipse(x, y, r, r * 0.92, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(70,16,32,0.9)';
  ctx.fill();
  ctx.beginPath();                                   // 盤面（淡膚色）
  ctx.ellipse(x, y, r * 0.82, r * 0.74, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#e9b6ab';
  ctx.fill();
  ctx.beginPath();                                   // 中央凹陷
  ctx.ellipse(x, y, r * 0.42, r * 0.38, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#a8556a';
  ctx.fill();
  ctx.beginPath();                                   // 高光
  ctx.ellipse(x - r * 0.25, y - r * 0.25, r * 0.22, r * 0.18, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,240,235,0.8)';
  ctx.fill();
}

// 依中心線繪製觸手本體 + 吸盤（仿真實章魚觸手）
function paintTentacle(pts, base, opts) {
  if (pts.length < 2) return;
  const cd = opts.curlDir;

  const left = [], right = [], innerN = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i];
    const b = pts[Math.min(i + 1, pts.length - 1)];
    let dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    let nx = -dy / len, ny = dx / len;            // 單位法線
    if (i === 0) { nx = 1; ny = 0; }              // 根部維持水平固定切面（從海中伸出的固定開口）
    left.push({ x: a.x + nx * a.w, y: a.y + ny * a.w });
    right.push({ x: a.x - nx * a.w, y: a.y - ny * a.w });
    innerN.push({ x: nx * cd, y: ny * cd });        // 指向捷曲內側
  }

  // 本體填色
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  const g = ctx.createLinearGradient(base.x - 40, base.y, base.x + 40, base.y - opts.lenPx);
  g.addColorStop(0, '#4e1226');
  g.addColorStop(0.45, '#8c2240');
  g.addColorStop(1, '#b23a5a');
  ctx.fillStyle = g;
  ctx.fill();

  // 內部陰影／高光（夾在本體內）
  ctx.clip();
  const outerEdge = cd > 0 ? right : left;          // 背側暗部
  ctx.beginPath();
  ctx.moveTo(outerEdge[0].x, outerEdge[0].y);
  for (let i = 1; i < outerEdge.length; i++) ctx.lineTo(outerEdge[i].x, outerEdge[i].y);
  ctx.strokeStyle = 'rgba(45,8,22,0.55)';
  ctx.lineWidth = Math.max(3, opts.baseW * 0.7);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  const innerEdge = cd > 0 ? left : right;           // 內側亮部
  ctx.beginPath();
  ctx.moveTo(innerEdge[0].x, innerEdge[0].y);
  for (let i = 1; i < innerEdge.length; i++) ctx.lineTo(innerEdge[i].x, innerEdge[i].y);
  ctx.strokeStyle = 'rgba(225,130,150,0.28)';
  ctx.lineWidth = Math.max(1.5, opts.baseW * 0.32);
  ctx.stroke();
  ctx.restore();

  // 輪廓
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left[0].x, left[0].y);
  for (let i = 1; i < left.length; i++) ctx.lineTo(left[i].x, left[i].y);
  for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i].x, right[i].y);
  ctx.closePath();
  ctx.strokeStyle = 'rgba(38,6,20,0.9)';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.restore();

  // 吸盤（內側雙排）
  ctx.save();
  for (let i = 2; i < pts.length - 1; i++) {
    const a = pts[i];
    const inn = innerN[i];
    const sr = Math.max(0.9, a.w * 0.5);
    drawSucker(a.x + inn.x * a.w * 0.45, a.y + inn.y * a.w * 0.45, sr);
    if (i % 2 === 0 && a.w > 4.5) {
      const sr2 = sr * 0.6;
      drawSucker(a.x + inn.x * a.w * 0.95, a.y + inn.y * a.w * 0.95, sr2);
    }
  }
  ctx.restore();
}

// 章魚腳底部漣漪：數圈向外擴散的等角橢圓水波
function drawBaseRipples(bx, by, scale, now, seed, emerge) {
  const RINGS = 3, PERIOD = 1700;
  ctx.save();
  for (let k = 0; k < RINGS; k++) {
    const t = (((now + seed * 131) / PERIOD) + k / RINGS) % 1;
    const rx = (7 + 26 * t) * scale;
    const ry = rx * 0.5;
    const alpha = 0.45 * (1 - t) * (1 - t) * emerge;
    if (alpha <= 0.01) continue;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = 'rgba(175,220,245,0.95)';
    ctx.lineWidth = 1.1 * (1 - t * 0.4);
    ctx.beginPath();
    ctx.ellipse(bx, by, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawSeaMonster(now) {
  if (!seaMonster) return;
  const m = seaMonster;

  let emerge = 1, lungeBlend = 0, tipTarget = null;
  if (m.phase === 'emerging') emerge = smoothstep(Math.min((now - m.born) / SM_EMERGE_MS, 1));
  else if (m.phase === 'retracting') emerge = 1 - smoothstep(Math.min((now - m.born) / SM_RETRACT_MS, 1));
  else if (m.phase === 'grab') {
    const gt = Math.min((now - m.grabStart) / SM_GRAB_MS, 1);
    lungeBlend = smoothstep(Math.min(gt / 0.32, 1));
    const ps = toScreen(player.gx, player.gy, tileAt(Math.round(player.gx), Math.round(player.gy)));
    tipTarget = { x: ps.x, y: ps.y - 14 };
  }
  if (emerge <= 0.001) return;

  const mainBase = toScreen(m.gx, m.gy, -1);

  // 收集所有觸手（主 + 裝飾），各自帶根部螢幕座標與等角深度
  const items = [];
  items.push({
    isMain: true, gx: m.gx, gy: m.gy, base: mainBase,
    opts: { now, emerge, lenPx: 130, baseW: 16, tipW: 2.2,
            curlDir: m.curlDir, swayPhase: m.swayPhase, tipTarget, lungeBlend }
  });
  if (m.decor) for (const d of m.decor) {
    items.push({
      isMain: false, gx: d.gx, gy: d.gy, base: toScreen(d.gx, d.gy, -1),
      opts: { now, emerge, lenPx: d.lenPx, baseW: d.baseW, tipW: 1.6,
              curlDir: d.curlDir, swayPhase: d.swayPhase }
    });
  }

  // ① 先畫全部底部水環（最底層）
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.006);
  for (const it of items) {
    ctx.save();
    ctx.globalAlpha = it.isMain ? (0.35 + 0.2 * pulse) : 0.20;
    ctx.fillStyle = it.isMain ? 'rgba(18,8,26,0.6)' : 'rgba(18,8,26,0.5)';
    const rw = it.isMain ? 18 + 4 * pulse : 8;
    const rh = it.isMain ? 9 + 2 * pulse : 4.5;
    ctx.beginPath();
    ctx.ellipse(it.base.x, it.base.y, rw, rh, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ② 依根部等角深度排序：後方(gx+gy 小)先畫、前方後畫（畫家演算法）
  //    抓取撲擊時也維持同樣的深度順序，避免主觸手突然跳到最上層
  items.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

  // ③ 逐條繪製（每條：本體 → 吸盤，整條畫完才畫下一條）
  for (const it of items) {
    const pts = buildTentacle(it.base, it.opts);
    paintTentacle(pts, it.base, { lenPx: it.opts.lenPx, baseW: it.opts.baseW, curlDir: it.opts.curlDir });
  }

  // 浮現警告紅光
  if (m.phase === 'emerging') {
    const e = (now - m.born) / SM_EMERGE_MS;
    ctx.save();
    ctx.globalAlpha = 0.4 * (1 - e) + 0.12;
    const wg = ctx.createRadialGradient(mainBase.x, mainBase.y - 30, 6, mainBase.x, mainBase.y - 30, 80);
    wg.addColorStop(0, 'rgba(220,40,90,0.5)');
    wg.addColorStop(1, 'rgba(220,40,90,0)');
    ctx.fillStyle = wg;
    ctx.fillRect(mainBase.x - 80, mainBase.y - 140, 160, 170);
    ctx.restore();
  }
}

function drawTentacleSplashes() {
  for (const d of tentacleSplashes) {
    const p = toScreen(d.gx, d.gy, -1);
    ctx.save();
    ctx.globalAlpha = Math.max(0, d.alpha);
    ctx.fillStyle = 'rgba(190,225,245,0.95)';
    ctx.beginPath();
    ctx.arc(p.x + d.x, p.y + d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function triggerDeath() {
  if (isDead) return;
  isDead = true;
  held.clear();
  setTimeout(() => {
    const ds = document.getElementById('death-screen');
    ds.classList.add('show');
  }, 350);
}

function restartGame() {
  document.getElementById('death-screen').classList.remove('show');
  isDead = false;
  seaMonster = null;
  deepThrowCount = 0;
  tentacleSplashes.length = 0;
  playerHoldingPebble = false; throwAnim = null;
  applySeedStr(currentSeed);   // 同一張地圖重生
}

document.getElementById('btn-restart').addEventListener('click', restartGame);

function drawSandGrains(gx, gy, p) {
  const mapSeedNum = seedFromString(currentSeed);
  let h = (gx * 374761393 + gy * 668265263 + mapSeedNum) | 0;
  
  const count = 3 + (Math.abs(h) % 3);
  
  for (let i = 0; i < count; i++) {
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    const rx = (h % 56) - 28;
    const ry = ((h >> 5) % 28) - 14;
    if (Math.abs(rx) * 14 + Math.abs(ry) * 28 <= 28 * 14) {
      const flicker = Math.sin(wavePhase * 3 + (h % 10));
    
    // 只在 sin 波峰時顯示（模擬反光瞬間）
    if (flicker > 0.9) {
      const alpha = (flicker - 0.9) * 8; // 讓閃爍更銳利
      ctx.fillStyle = `rgba(255, 255, 210, ${alpha})`;
      // 畫一個極小的點 (1x1 像素)
      ctx.fillRect(p.x + rx, p.y + ry, 1, 1);
    }
    }
  }
}

// ═══════════════════════════════════════════════════════
// ④ 草地踩壓系統（劇烈搖晃版）
// ═══════════════════════════════════════════════════════
const trampledGrass = new Map();
const GRASS_SHAKE_DUR = 800;   // 搖晃持續時間 ms

function trampleGrass(gx, gy, dir) {
  if (tileAt(gx, gy) !== 2) return;
  trampledGrass.set(`${gx},${gy}`, { trampledAt: performance.now() });
}

function grassShakeIntensity(gx, gy) {
  const key = `${gx},${gy}`;
  if (!trampledGrass.has(key)) return 0;
  const { trampledAt } = trampledGrass.get(key);
  const elapsed = performance.now() - trampledAt;
  if (elapsed >= GRASS_SHAKE_DUR) { trampledGrass.delete(key); return 0; }
  // 先快速衝到最大強度，再逐漸衰退
  const t = elapsed / GRASS_SHAKE_DUR;
  return (1 - t) * (1 - t);
}

function drawGrassOnTile(gx, gy, p) {
  const mapSeedNum = seedFromString(currentSeed);
  let h = (gx * 374761393 + gy * 668265263 + mapSeedNum) | 0;
  h = Math.imul(h ^ (h >>> 13), 12741261); h = h ^ (h >>> 16);
  const clusterHash = Math.abs(h);
  if ((clusterHash % 100) >= 20) return;

  const shakeAmt = grassShakeIntensity(gx, gy);
  // 正常風速 + 踩踏時疊加高頻不規則搖晃
  const baseWind = Math.sin(wavePhase + gx * 0.5 + gy * 0.3) * 1.0;
  const count = 8 + (clusterHash % 3);

  ctx.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const subSeed = (clusterHash >> i) + i;
    const rx = (subSeed % 26) - 13;
    const ry = ((subSeed * 7) % 14) - 7;
    const px = p.x + rx;
    const py = p.y + ry;

    const h1 = 3 + (subSeed % 3);
    const h2 = 5 + (subSeed % 6);
    const h3 = 3 + (subSeed % 4);

    // 每根草葉有非常細微的顏色差異製造層次感
    const colorVar = ((subSeed * 13 + i * 7) % 17) - 8; // -8 ~ +8
    const gr = Math.min(255, Math.max(0, 78 + Math.floor(colorVar * 2.4)));
    const gg = Math.min(255, Math.max(0, 156 + colorVar));
    const gb = Math.min(255, Math.max(0, 97 + Math.floor(colorVar * 3.6)));
    ctx.strokeStyle = `rgb(${gr},${gg},${gb})`;
    ctx.lineWidth = 1.5;

    // 每根草葉各有自己的相位偏移，製造不規則感
    const phaseOffset = (subSeed % 13) * 0.48;
    // 搖晃頻率高、幅度大、各葉方向略不同
    const shakeFreq = 18 + (subSeed % 7) * 2;   // 高頻
    const shakeMag  = shakeAmt * (8 + (subSeed % 5) * 1.5);
    const shakeX = Math.sin(wavePhase * shakeFreq + phaseOffset) * shakeMag;
    const wind = baseWind + shakeX;

    ctx.beginPath();
    ctx.moveTo(px - 2, py);
    ctx.lineTo(px - 4 + wind * 0.6, py - h1);
    ctx.moveTo(px, py);
    ctx.lineTo(px + wind, py - h2);
    ctx.moveTo(px + 2, py);
    ctx.lineTo(px + 4 + wind * 0.6, py - h3);
    ctx.stroke();
  }
}


function seedFromString(str) {
  let h = 0; for (let i = 0; i < str.length; i++) h = Math.imul(31,h) + str.charCodeAt(i) | 0;
  return h >>> 0;
}
function makePRNG(seed) {
  let s = seed; return () => {
    s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s>>>15, 1|s);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function smoothstep(t) { return t*t*(3-2*t); }
function lerp(a,b,t) { return a+(b-a)*t; }
function buildNoise2D(rng, size) {
  const g = Array.from({length:size}, ()=>Array.from({length:size}, ()=>rng()*2-1));
  return (x,y) => {
    const xi=Math.floor(x)%size, yi=Math.floor(y)%size, xf=x-Math.floor(x), yf=y-Math.floor(y);
    const xi1=(xi+1)%size, yi1=(yi+1)%size;
    return lerp(lerp(g[yi][xi],g[yi][xi1],smoothstep(xf)),lerp(g[yi1][xi],g[yi1][xi1],smoothstep(xf)),smoothstep(yf));
  };
}

function generateMap(seedStr) {
  const n1=buildNoise2D(makePRNG(seedFromString(seedStr+'A')),16);
  const n2=buildNoise2D(makePRNG(seedFromString(seedStr+'B')),8);
  const n3=buildNoise2D(makePRNG(seedFromString(seedStr+'C')),32);
  return Array.from({length:ROWS},(_,gy)=>
    Array.from({length:COLS},(_,gx)=>{
      const n=n1(gx*.18,gy*.18)*.55+n2(gx*.35,gy*.35)*.25+n3(gx*.08,gy*.08)*.20;
      const h=((gx-gy)/(COLS+ROWS))*1.8+n*0.7;
      return h<-0.65?-1:h<-0.20?0:h<0.20?1:h<0.70?2:3;
    }));
}

function applySeedStr(seedStr) {
  seedStr=seedStr.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5).padEnd(5,'0');
  currentSeed=seedStr; document.getElementById('seed-input').value=seedStr;
  MAP=generateMap(seedStr); footprints.length=0; ripples.length=0; surfaceBubbles.length=0;
  splashDrops.length=0; bodyDroplets.length=0; bodyDripActive=false;
  trampledGrass.clear(); pebbleSplashes.length=0; throwAnim=null;
  buildPebbleObjects(); spawnFishesOnMap();
  let sx=Math.floor(COLS*.55), sy=Math.floor(ROWS*.45);
  outer: for (let r=0;r<Math.max(ROWS,COLS);r++) {
    for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++) {
      if (Math.abs(dx)!==r&&Math.abs(dy)!==r) continue;
      if (tileAt(sx+dx, sy+dy)===1||tileAt(sx+dx, sy+dy)===2) { sx+=dx; sy+=dy; break outer; }
    }
  }
  player.gx=sx; player.gy=sy; player.tx=sx; player.ty=sy;
  // 🐙 海怪狀態重置
  deepSeaCount = countDeepSea();
  deepThrowCount = 0;
  seaMonster = null;
  if (typeof tentacleSplashes !== 'undefined') tentacleSplashes.length = 0;
}

function randomSeed() { applySeedStr(Array.from({length:5},()=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.floor(Math.random()*36)]).join('')); }
function applySeed()  { applySeedStr(document.getElementById('seed-input').value); }
function generateBiasedSeed(t) {
  let bS='', mC=-1; for(let i=0;i<30;i++){
    let ts=Array.from({length:5},()=>'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.floor(Math.random()*36)]).join('');
    let tm=generateMap(ts), c=0; for(let r=0;r<ROWS;r++) for(let col=0;col<COLS;col++) if(tm[r][col]===t) c++;
    if(c>mC){mC=c;bS=ts;}
  }
  applySeedStr(bS);
}

function tileAt(gx,gy) { if(gx<0||gy<0||gx>=COLS||gy>=ROWS) return -2; return MAP[gy]?MAP[gy][gx]:-2; }
function isWalkable(gx,gy) {
  if (tileAt(gx,gy) < -1) return false;
  // 鵝卵石物件阻擋移動
  if (pebbleObjects.some(pb => pb.gx === gx && pb.gy === gy)) return false;
  return true;
}
function mapOrigin() { return { ox:canvas.width/2.1, oy:Math.floor((canvas.height-(COLS+ROWS)*HH)/2)+45 }; }
function toScreen(fx,fy,type) {
  const {ox,oy}=mapOrigin(); return { x:ox+(fx-fy)*HW, y:oy+(fx+fy)*HH-(ELEV[String(type)]??0) };
}

let wavePhase=0;

// ── 滑鼠懸停格子標示系統 ─────────────────────────────────
let hoverTile = { gx: -1, gy: -1 };

canvas.addEventListener('mousemove', e => {
  const {sx, sy} = getCanvasPos(e.clientX, e.clientY);
  const iso = screenToIso(sx, sy);
  const hgx = Math.round(iso.gx), hgy = Math.round(iso.gy);
  if (hgx >= 0 && hgy >= 0 && hgx < COLS && hgy < ROWS) {
    hoverTile.gx = hgx; hoverTile.gy = hgy;
  } else {
    hoverTile.gx = -1; hoverTile.gy = -1;
  }
});
canvas.addEventListener('mouseleave', () => { hoverTile.gx = -1; hoverTile.gy = -1; });
// ──────────────────────────────────────────────────────────

function drawTile(gx,gy) {
  const type=tileAt(gx,gy); if(type===-2) return;
  const p=toScreen(gx,gy,type), thick=getThick(type);
  ctx.beginPath(); ctx.moveTo(p.x,p.y-HH); ctx.lineTo(p.x+HW,p.y); ctx.lineTo(p.x,p.y+HH); ctx.lineTo(p.x-HW,p.y); ctx.closePath();
  if(type===-1){ ctx.fillStyle=`rgb(${13+Math.sin(wavePhase+gx*.7+gy*.5)*10},${26+Math.sin(wavePhase+gx*.7+gy*.5)*20},${71+Math.sin(wavePhase+gx*.7+gy*.5)*10})`; }
  else if(type===0){ ctx.fillStyle=`rgb(28,${Math.floor(150+Math.sin(wavePhase*1.2+gx*.9-gy*.6)*12)},${Math.floor(195+Math.sin(wavePhase*1.2+gx*.9-gy*.6)*12)})`; }
  else { ctx.fillStyle=COLOR[String(type)].top; }
  ctx.fill();
  if(type===2) drawGrassOnTile(gx, gy, p);
  if(type===1) drawSandGrains(gx, gy, p);
  if(type>=1) drawFootprints(gx,gy);
  if(type===0) drawRipplesAt(gx, gy, p);
  if(type===-1||type===0) drawSurfaceBubblesAt(gx, gy, p);
  if(type===-1) drawSplashDropsAt(gx, gy);
  // ── 懸停格子高亮邊框 ──
  if (gx === hoverTile.gx && gy === hoverTile.gy) {
    const isThrowMode = playerHoldingPebble && !throwAnim;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - HH);
    ctx.lineTo(p.x + HW, p.y);
    ctx.lineTo(p.x, p.y + HH);
    ctx.lineTo(p.x - HW, p.y);
    ctx.closePath();
    ctx.strokeStyle = isThrowMode ? 'rgba(255, 120, 60, 0.92)' : 'rgba(255, 255, 255, 0)';
    ctx.lineWidth = isThrowMode ? 3.0 : 2.2;
    ctx.lineCap = "round"; // 讓線段末端圓潤一點比較美觀

    // 定義格子的四個頂點
    const top = { x: p.x, y: p.y - HH };
    const right = { x: p.x + HW, y: p.y };
    const bottom = { x: p.x, y: p.y + HH };
    const left = { x: p.x - HW, y: p.y };

    // gap 控制線段的長度，0.3 代表畫出邊長的 30%
    const gap = 0.3; 

    // 開始繪製四個角落的 L 型線段
    ctx.beginPath();

    // 1. 上頂點的角落
    ctx.moveTo(top.x - HW * gap, top.y + HH * gap);
    ctx.lineTo(top.x, top.y);
    ctx.lineTo(top.x + HW * gap, top.y + HH * gap);

    // 2. 下頂點的角落
    ctx.moveTo(bottom.x - HW * gap, bottom.y - HH * gap);
    ctx.lineTo(bottom.x, bottom.y);
    ctx.lineTo(bottom.x + HW * gap, bottom.y - HH * gap);

    // 3. 左頂點的角落
    ctx.moveTo(left.x + HW * gap, left.y - HH * gap);
    ctx.lineTo(left.x, left.y);
    ctx.lineTo(left.x + HW * gap, left.y + HH * gap);

    // 4. 右頂點的角落
    ctx.moveTo(right.x - HW * gap, right.y - HH * gap);
    ctx.lineTo(right.x, right.y);
    ctx.lineTo(right.x - HW * gap, right.y + HH * gap);

    ctx.stroke();
    ctx.restore();
  }
  // ────────────────────────
  ctx.beginPath(); ctx.moveTo(p.x-HW,p.y); ctx.lineTo(p.x,p.y+HH); ctx.lineTo(p.x,p.y+HH+thick); ctx.lineTo(p.x-HW,p.y+thick); ctx.closePath(); ctx.fillStyle=COLOR[String(type)].left; ctx.fill();
  ctx.beginPath(); ctx.moveTo(p.x+HW,p.y); ctx.lineTo(p.x,p.y+HH); ctx.lineTo(p.x,p.y+HH+thick); ctx.lineTo(p.x+HW,p.y+thick); ctx.closePath(); ctx.fillStyle=COLOR[String(type)].right; ctx.fill();
}

function drawPlayer(gx,gy,frame) {
  const p=toScreen(gx,gy,tileAt(Math.round(gx),Math.round(gy)));
  const isMoving=Math.abs(player.tx-player.gx)>0.01||Math.abs(player.ty-player.gy)>0.01;
  const bob=isMoving?Math.sin(frame*.18)*2.5:0;
  ctx.save(); ctx.globalAlpha=0.22; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(p.x,p.y,14,5,0,0,Math.PI*2); ctx.fill(); ctx.restore();
  // --- 修改後的邏輯 ---
  let activeSprite, fi;
  if (throwAnim && !throwAnim.done) {
    // 1. 投擲動作期間：使用投擲專用的 rcssavage.png
    activeSprite = (pebbleThrowSprite.complete && pebbleThrowSprite.naturalWidth > 0) 
                   ? pebbleThrowSprite : playerSprite;
    fi = 1; // 投擲動作幀
  } else if (playerHoldingPebble) {
    // 2. 僅持有石頭期間：使用 cssavage.png
    activeSprite = (pebbleHeldSprite.complete && pebbleHeldSprite.naturalWidth > 0) 
                   ? pebbleHeldSprite : playerSprite;
    fi = isMoving ? Math.floor(frame/6)%SPRITE_COLUMNS : 0;
  } else {
    // 3. 一般狀態：使用預設的 savage.png
    activeSprite = playerSprite;
    fi = isMoving ? Math.floor(frame/6)%SPRITE_COLUMNS : 0;
  }
  // ------------------
  if(!activeSprite.complete||SPRITE_FRAME_W===0) return;
  const dh=80, dw=(SPRITE_FRAME_W/SPRITE_FRAME_H)*dh;
  const type=tileAt(Math.round(gx),Math.round(gy));
  if(type===0||type===-1){
    const sd=(type===-1)?40:10, wy=p.y-0.2+(type===-1?-5:0);
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,canvas.width,wy); ctx.clip();
    ctx.imageSmoothingEnabled=false; ctx.drawImage(activeSprite,fi*SPRITE_FRAME_W,player.dir*SPRITE_FRAME_H,SPRITE_FRAME_W,SPRITE_FRAME_H,p.x-dw/2,p.y-bob-dh+10+sd,dw,dh);
    ctx.restore();
  } else {
    ctx.save(); ctx.imageSmoothingEnabled=false; ctx.drawImage(activeSprite,fi*SPRITE_FRAME_W,player.dir*SPRITE_FRAME_H,SPRITE_FRAME_W,SPRITE_FRAME_H,p.x-dw/2,p.y-bob-dh+10,dw,dh);
    ctx.restore();
  }
}

const player={gx:12,gy:8,tx:12,ty:8,frame:0,dir:1};
const held=new Set();
window.addEventListener('keydown', e => {

// ── 滑鼠 / 觸控點擊移動 ──────────────────────────────────
// 將螢幕座標（canvas邏輯座標）反推為等角格子座標
function screenToIso(sx, sy) {
  const {ox, oy} = mapOrigin();
  // 建議統一使用固定高度（如 0）作為點擊平面，
  // 或者使用一個中間值，避免滑鼠與格子的視覺距離因玩家位置而變動。
  const elev = 15; 
  const adjY = sy - oy + elev;
  const diffX = (sx - ox) / HW;
  const sumXY = adjY / HH;
  return { gx: (diffX + sumXY) / 2, gy: (sumXY - diffX) / 2 };
}

// 根據點擊的等角座標，決定應往哪個方向走一格
function moveTowardIso(isoX, isoY) {
  if (prompting) return;
  // 相對於玩家目前目標格的偏移
  const dx = isoX - player.tx;
  const dy = isoY - player.ty;
  if (Math.abs(dx) < 0.001 && Math.abs(dy) < 0.001) return;

  // 等角座標中四個方向：
  //   dir 0 (right/東北): gx+1, gy-0  → dx>0, dy<0
  //   dir 1 (down/東南):  gx+1, gy+0  → dx>0, dy>0  (實際上 gx↑ = 往右下)
  //   dir 2 (left/西南):  gx-0, gy+1  → dx<0, dy>0
  //   dir 3 (up/西北):    gx-1, gy+0  → dx<0, dy<0
  // 以 45° 分界線切四象限，再挑主要軸
  let stepX = 0, stepY = 0;
  if (Math.abs(dx) >= Math.abs(dy)) {
    stepX = dx > 0 ? 1 : -1;
  } else {
    stepY = dy > 0 ? 1 : -1;
  }

  // 對應 WASD 方向定義：W=(-1,0)dir3, S=(1,0)dir1, A=(0,1)dir2, D=(0,-1)dir0
  if      (stepX === -1) player.dir = 3;
  else if (stepX ===  1) player.dir = 1;
  else if (stepY ===  1) player.dir = 2;
  else if (stepY === -1) player.dir = 0;

  const nx = player.tx + stepX;
  const ny = player.ty + stepY;

  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
    if (boundaryCooldown <= 0) triggerTransitionPrompt(player.tx, player.ty);
    return;
  }
  if (!isWalkable(nx, ny)) return;

  const cT = tileAt(player.tx, player.ty), nT = tileAt(nx, ny);
  if (cT === 0  && nT === -1) addSplash(nx, ny);
  if (cT === -1 && nT ===  0) startBodyDrip(1.0);
  if (cT === 0  && nT ===  1) startBodyDrip(0.65);
  if ((cT === 0 || cT === -1) && nT >= 1) footprintBudget = FOOTPRINT_COUNT;
  if (footprintBudget > 0 && nT >= 1) { addFootprint(nx, ny, stepFoot, player.dir); stepFoot = 1 - stepFoot; footprintBudget--; }
  if (nT === 0) addRipple(nx, ny);
  if (nT === 2) trampleGrass(nx, ny);
  player.tx = nx; player.ty = ny;
}

// 取得事件在 canvas 邏輯座標中的位置（處理CSS縮放）
function getCanvasPos(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const cw = canvas.width;  // 1280
  const ch = canvas.height; // 720
  
  // 計算實際縮放比例
  const scale = Math.min(rect.width / cw, rect.height / ch);
  
  // 計算畫布內容在元素內部的實際起始點（扣除黑邊）
  const offsetX = (rect.width - cw * scale) / 2;
  const offsetY = (rect.height - ch * scale) / 2;

  return {
    sx: (clientX - rect.left - offsetX) / scale,
    sy: (clientY - rect.top - offsetY) / scale
  };
}

// ── 滑鼠點擊（桌面）──────────────────────────────────────
// 桌面端行為保持不變：
//   未持石：點擊石頭拾取（近距離）；其他格子移動
//   持石中：點擊任意格子投擲
canvas.addEventListener('click', e => {
  if (Math.abs(player.tx - player.gx) > 0.3 || Math.abs(player.ty - player.gy) > 0.3) return;
  if (prompting) return;
  const {sx, sy} = getCanvasPos(e.clientX, e.clientY);

  // 持有鵝卵石時：點擊任意格子觸發投擲（桌面保持原本行為）
  if (playerHoldingPebble && !throwAnim) {
    const iso = screenToIso(sx, sy);
    const tgx = Math.round(iso.gx), tgy = Math.round(iso.gy);
    if (tgx >= 0 && tgy >= 0 && tgx < COLS && tgy < ROWS) {
      throwPebble(tgx, tgy);
      return;
    }
  }

  if (!playerHoldingPebble) {
    const nearbyPb = getNearbyPebble();
    if (nearbyPb) {
      const ps = toScreen(nearbyPb.gx, nearbyPb.gy, tileAt(nearbyPb.gx, nearbyPb.gy));
      const d = Math.hypot(sx - ps.x, sy - (ps.y - 4));
      if (d < 52) {
        pickUpPebble(nearbyPb);
        return;
      }
    }
  }
  const iso = screenToIso(sx, sy);
  moveTowardIso(iso.gx, iso.gy);
});

// ── 觸控雙擊偵測狀態 ─────────────────────────────────────
// 觸控端的互動邏輯（與桌面滑鼠分開）：
//   未持石：單擊→移動；雙擊近距石頭→拾取
//   持石中：單擊→移動；雙擊任意格子→投擲
const DOUBLE_TAP_MS = 320; // 雙擊時間窗口（毫秒）
let lastTapTime   = 0;
let lastTapX      = 0;
let lastTapY      = 0;
const DOUBLE_TAP_DIST = 60; // 兩次點擊距離上限（像素）

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (prompting) return;
  const touch = e.changedTouches[0];
  const {sx, sy} = getCanvasPos(touch.clientX, touch.clientY);
  const now = performance.now();

  const timeSinceLast = now - lastTapTime;
  const distFromLast  = Math.hypot(sx - lastTapX, sy - lastTapY);
  const isDoubleTap   = timeSinceLast < DOUBLE_TAP_MS && distFromLast < DOUBLE_TAP_DIST;

  // 記錄本次點擊，供下次判斷
  lastTapTime = now;
  lastTapX = sx;
  lastTapY = sy;

  // 角色還在移動插值中，忽略輸入（避免連點亂跑）
  if (Math.abs(player.tx - player.gx) > 0.3 || Math.abs(player.ty - player.gy) > 0.3) return;

  if (isDoubleTap) {
    // ── 雙擊 ──────────────────────────────────
    if (!playerHoldingPebble) {
      // 未持石：雙擊石頭→拾取
      const nearbyPb = getNearbyPebble();
      if (nearbyPb) {
        const ps = toScreen(nearbyPb.gx, nearbyPb.gy, tileAt(nearbyPb.gx, nearbyPb.gy));
        const d = Math.hypot(sx - ps.x, sy - (ps.y - 4));
        if (d < 65) {
          pickUpPebble(nearbyPb);
          lastTapTime = 0; // 重置，避免三擊誤觸
          return;
        }
      }
    } else {
      // 持石中：雙擊目標格→投擲
      if (!throwAnim) {
        const iso = screenToIso(sx, sy);
        const tgx = Math.round(iso.gx), tgy = Math.round(iso.gy);
        if (tgx >= 0 && tgy >= 0 && tgx < COLS && tgy < ROWS) {
          throwPebble(tgx, tgy);
          lastTapTime = 0;
          return;
        }
      }
    }
    // 雙擊但未命中石頭/投擲目標：仍執行移動
    const iso = screenToIso(sx, sy);
    moveTowardIso(iso.gx, iso.gy);
  } else {
    // ── 單擊 → 移動（不論是否持石） ──────────────
    const iso = screenToIso(sx, sy);
    moveTowardIso(iso.gx, iso.gy);
  }
}, { passive: false });

// 防止觸控時頁面滾動
canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove',  e => e.preventDefault(), { passive: false });
// ─────────────────────────────────────────────────────────

let prompting=false, boundaryCooldown=0;
function triggerTransitionPrompt(cx,cy){
  prompting=true; held.clear();
  const modal=document.getElementById('transition-modal'); modal.style.display='block';
  document.getElementById('btn-yes').onclick=()=>{ modal.style.display='none'; prompting=false; generateBiasedSeed(MAP[cy][cx]); };
  document.getElementById('btn-no').onclick=()=>{ modal.style.display='none'; prompting=false; boundaryCooldown=60; };
}

function update(){
  player.gx+=(player.tx-player.gx)*0.28; player.gy+=(player.ty-player.gy)*0.28;
  if(boundaryCooldown>0) boundaryCooldown--;
  if(!prompting && !isDead && !(seaMonster&&seaMonster.phase==='grab') && !(Math.abs(player.tx-player.gx)>0.15||Math.abs(player.ty-player.gy)>0.15)){
    let dx=0, dy=0;
    if(held.has('ArrowUp')||held.has('w')){dx=-1;dy=0;player.dir=3;}
    else if(held.has('ArrowDown')||held.has('s')){dx=1;dy=0;player.dir=1;}
    else if(held.has('ArrowLeft')||held.has('a')){dx=0;dy=1;player.dir=2;}
    else if(held.has('ArrowRight')||held.has('d')){dx=0;dy=-1;player.dir=0;}
    if(dx!==0||dy!==0){
      const nx=player.tx+dx, ny=player.ty+dy;
      if(nx<0||ny<0||nx>=COLS||ny>=ROWS){ if(boundaryCooldown<=0) triggerTransitionPrompt(player.tx,player.ty); }
      else if(isWalkable(nx,ny)){
        const cT=tileAt(player.tx,player.ty), nT=tileAt(nx,ny);
        if(cT===0 && nT===-1) addSplash(nx, ny);
        if(cT===-1 && nT===0) startBodyDrip(1.0);
        if(cT===0 && nT===1) startBodyDrip(0.65);
        if((cT===0||cT===-1)&&nT>=1) footprintBudget=FOOTPRINT_COUNT;
        if(footprintBudget>0&&nT>=1){ addFootprint(nx,ny,stepFoot,player.dir); stepFoot=1-stepFoot; footprintBudget--; }
        if(nT===0) addRipple(nx,ny); if(nT===2) trampleGrass(nx,ny);
        player.tx=nx; player.ty=ny;
      }
    }
  }
  const curT=tileAt(Math.round(player.gx), Math.round(player.gy));
  if (curT===-1 && player.frame%30===0) {
    let fx=0,fy=0; if(player.dir===0)fy=-1;else if(player.dir===1)fx=1;else if(player.dir===2)fy=1;else fx=-1;
    if(tileAt(Math.round(player.gx)+fx,Math.round(player.gy)+fy)<1) surfaceBubbles.push({gx:Math.round(player.gx)+fx, gy:Math.round(player.gy)+fy, ox:Math.random()*30-15, oy:Math.random()*10-5, r:1+Math.random()*2, alpha:1, born:performance.now(), life:1200+Math.random()*800});
  }
  player.frame++; wavePhase+=0.04; const now=performance.now();
  updateFootprints(now); updateRipples(now); updateSurfaceBubbles(); updateSplashDrops(now); updateBodyDroplets(now); updateFishes(now);
  updateThrowAnim(now); updatePebbleSplashes(now); updateSecondaryThrows(now);
  updateSeaMonster(now);
}

function render(){
  const sg=ctx.createLinearGradient(0,0,0,canvas.height*.6); sg.addColorStop(0,'#0f2744'); sg.addColorStop(1,'#2e6080');
  ctx.fillStyle=sg; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let s=0;s<ROWS+COLS-1;s++) for(let gx=0;gx<COLS;gx++){ let gy=s-gx; if(gy>=0&&gy<ROWS) drawTile(gx,gy); }
  // 在玩家同層前，依等角順序繪製鵝卵石物件
  const sortedPb = pebbleObjects.slice().sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));
  for(const pb of sortedPb) drawPebbleObject(pb);
  drawAllFishes();
  const smNow = performance.now();
  // 🐙 海怪 z-order：捲走時或位於玩家前方時，蓋在玩家之上
  const monsterAfterPlayer = !seaMonster ? false :
      (seaMonster.phase === 'grab') ||
      ((seaMonster.gx + seaMonster.gy) >= (player.gx + player.gy));
  if (seaMonster && !monsterAfterPlayer) drawSeaMonster(smNow);
  drawPlayer(player.gx,player.gy,player.frame);
  if (seaMonster && monsterAfterPlayer) drawSeaMonster(smNow);
  drawBodyDroplets();
  const now2 = performance.now();
  drawThrowAnim(now2);
  drawSecondaryThrows(now2);
  drawPebbleSplashes();
  drawTentacleSplashes();
}

randomSeed();
(function loop(){ update(); render(); requestAnimationFrame(loop); })();
</script>
</body>
